<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Project Timeline</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Admin Panel</h1>
            <a href="/" class="back-link">← Back to Timeline</a>
        </div>

        <div class="admin-content">
            <div class="create-form-section">
                <h2>Create New Project</h2>
                <form id="createForm" class="form">
                    <div class="form-group">
                        <label for="name">Project Name *</label>
                        <input type="text" id="name" name="name" required placeholder="e.g., OpenDB">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Project description..." rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="github_url">GitHub URL *</label>
                        <input type="url" id="github_url" name="github_url" required placeholder="https://github.com/username/repo">
                    </div>

                    <div class="form-group">
                        <label for="color">Color *</label>
                        <div class="color-picker">
                            <input type="color" id="color" name="color" value="#00d4aa">
                            <span id="colorValue">#00d4aa</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Project</button>
                </form>
            </div>

            <div class="projects-table-section">
                <h2>Projects Management</h2>
                
                <div class="actions" style="margin-bottom: 15px; display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="exportProjects()">Export JSON</button>
                    <label class="btn btn-secondary" style="cursor: pointer; margin: 0;">
                        Import JSON
                        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importProjects(event)">
                    </label>
                </div>
<div class="table-wrapper">
                    <table id="projectsTable" class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Description</th>
                                <th>GitHub</th>
                                <th>Status</th>
                                <th>Color</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projectsBody">
                            <tr class="loading-row">
                                <td colspan="6">Loading projects...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Project</h2>
            <form id="editForm" class="form">
                <input type="hidden" id="editId" name="id">
                
                <div class="form-group">
                    <label for="editName">Project Name</label>
                    <input type="text" id="editName" name="name">
                </div>

                <div class="form-group">
                    <label for="editDescription">Description</label>
                    <textarea id="editDescription" name="description" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="editGithubUrl">GitHub URL</label>
                    <input type="url" id="editGithubUrl" name="github_url">
                </div>

                <div class="form-group">
                    <label for="editColor">Color</label>
                    <div class="color-picker">
                        <input type="color" id="editColor" name="color">
                        <span id="editColorValue"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="editStatus">Status</label>
                    <select id="editStatus" name="status">
                        <option value="active">Active</option>
                        <option value="paused">Paused</option>
                        <option value="completed">Completed</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/admin.js?v=2"></script>

    <div id="pomodoroModal" class="modal" style="display: none;">
        <div class="modal-content" style="text-align: center; max-width: 400px;">
            <span class="close" id="closePomodoro">&times;</span>
            <h2>Pomodoro - <span id="pomodoroProjectName"></span></h2>
            <div id="pomodoroTimer" style="font-size: 48px; font-weight: bold; margin: 20px 0; font-family: monospace;">25:00</div>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn btn-primary" id="startPomodoroBtn">Start</button>
                <button class="btn btn-secondary" id="pausePomodoroBtn" style="display:none;">Pause</button>
                <button class="btn btn-danger" id="stopPomodoroBtn">Stop & Save</button>
            </div>
        </div>
    </div>

</body>
</html>
